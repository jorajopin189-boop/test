<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #000;
  display: flex;
  flex-direction: column;
}

#video-container {
  position: relative;
  flex: 1;
}

iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

#open-browser-btn {
  width: 100%;
  padding: 12px;
  background: #ff6600;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  border: none;
}
</style>
</head>
<body>

<div id="video-container">
  <iframe 
    src="https://ok.ru/videoembed/1161630648985?nochat=1&autoplay=1" 
    allow="autoplay; fullscreen; web-share"
    allowfullscreen
    frameborder="0">
  </iframe>
</div>

<button id="open-browser-btn" onclick="openInBrowser()">Открыть в браузере</button>

<script>
function openInBrowser() {
  const url = "https://ok.ru/videoembed/1161630648985?nochat=1&autoplay=1";
  window.open(url, "_blank");
}
</script>

</body>
</html>
