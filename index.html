<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Навигатор аниме</title>
<style>
  body {
    margin:0; padding:0; font-family: Arial, sans-serif;
    background: #1b1b1b; color: #fff;
  }
  h1 { text-align:center; margin: 10px 0; }
  .season { margin: 10px; padding:10px; background:#2b2b2b; border-radius:8px; }
  .season h2 { margin:0 0 5px 0; }
  .episodes { display:flex; flex-wrap:wrap; gap:5px; }
  .episode-btn {
    padding:8px 12px; background:#ff6600; color:#fff; border:none;
    border-radius:5px; cursor:pointer; flex:1 0 60px; text-align:center;
  }
  .episode-btn:hover { background:#e65c00; }
</style>
</head>
<body>

<h1 id="anime-title">Аниме</h1>
<div id="seasons-container"></div>

<script>
async function loadAnime() {
  // Получаем animeId из query параметра
  const params = new URLSearchParams(window.location.search);
  const animeId = params.get("anime") || "demo-anime";

  // Загружаем JSON с данными
  const response = await fetch(`data/${animeId}.json`);
  const animeData = await response.json();

  document.getElementById("anime-title").textContent = animeData.title;

  const container = document.getElementById("seasons-container");

  animeData.seasons.forEach(season => {
    const seasonDiv = document.createElement("div");
    seasonDiv.className = "season";

    const seasonTitle = document.createElement("h2");
    seasonTitle.textContent = season.name;
    seasonDiv.appendChild(seasonTitle);

    const episodesDiv = document.createElement("div");
    episodesDiv.className = "episodes";

    season.episodes.forEach(ep => {
      const btn = document.createElement("button");
      btn.className = "episode-btn";
      btn.textContent = ep.number;
      btn.onclick = () => {
        // открываем серию в браузере (пример)
        window.open(ep.url, "_blank");
      };
      episodesDiv.appendChild(btn);
    });

    seasonDiv.appendChild(episodesDiv);
    container.appendChild(seasonDiv);
  });
}

loadAnime();
</script>

</body>
</html>
