<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аниме Навигатор</title>
<style>
  /* Тёмная тема */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #121212;
    color: #e0e0e0;
  }

  h1 {
    text-align: center;
    margin: 20px 0;
    font-weight: 400;
    color: #f5f5f5;
  }

  .season {
    margin: 10px 20px;
    border-radius: 10px;
    background: #1e1e1e;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .season-header {
    padding: 12px 16px;
    background: #2a2a2a;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.2s;
  }

  .season-header:hover {
    background: #3a3a3a;
  }

  .season-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 500;
  }

  .toggle-icon {
    transition: transform 0.2s;
    font-size: 16px;
  }

  .episodes {
    display: none;
    flex-wrap: wrap;
    padding: 10px;
    gap: 8px;
    background: #1b1b1b;
  }

  .episode-btn {
    flex: 1 0 60px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #90caf9;
    color: #121212;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    text-align: center;
  }

  .episode-btn:hover {
    background: #64b5f6;
  }

  /* Модальное окно */
  #manual-fallback {
    position: fixed;
    left:0; top:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
  }

  #manual-fallback div {
    max-width: 90%;
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    text-align:center;
    color:#e0e0e0;
  }

  #manual-fallback a, #manual-fallback button {
    margin:5px;
    padding:10px 14px;
    border-radius:8px;
    text-decoration:none;
    border:none;
    font-weight:500;
    cursor:pointer;
  }

  #manual-fallback a {
    background:#42a5f5;
    color:#121212;
  }

  #manual-fallback button {
    background:#333333;
    color:#e0e0e0;
  }
</style>
</head>
<body>

<h1 id="anime-title">Аниме</h1>
<div id="seasons-container"></div>

<script>
const demoAnimeId = "demo-anime";

async function loadAnime() {
  const params = new URLSearchParams(window.location.search);
  const animeId = params.get("anime") || demoAnimeId;

  const response = await fetch(`data/${animeId}.json`);
  const animeData = await response.json();

  document.getElementById("anime-title").textContent = animeData.title;

  const container = document.getElementById("seasons-container");

  animeData.seasons.forEach(season => {
    const seasonDiv = document.createElement("div");
    seasonDiv.className = "season";

    const header = document.createElement("div");
    header.className = "season-header";

    const title = document.createElement("h2");
    title.textContent = season.name;

    const icon = document.createElement("span");
    icon.className = "toggle-icon";
    icon.textContent = "▶";

    header.appendChild(title);
    header.appendChild(icon);
    seasonDiv.appendChild(header);

    const episodesDiv = document.createElement("div");
    episodesDiv.className = "episodes";

    season.episodes.forEach(ep => {
      const btn = document.createElement("button");
      btn.className = "episode-btn";
      btn.textContent = ep.number;
      btn.onclick = () => showOpenModal(ep.url);
      episodesDiv.appendChild(btn);
    });

    seasonDiv.appendChild(episodesDiv);
    container.appendChild(seasonDiv);

    header.addEventListener("click", () => {
      const isOpen = episodesDiv.style.display === "flex";
      episodesDiv.style.display = isOpen ? "none" : "flex";
      icon.classList.toggle("open", !isOpen);
    });
  });
}

// Показываем модальное окно с кнопкой для открытия видео во внешнем браузере
function showOpenModal(url) {
  if(document.getElementById('manual-fallback')) return;

  const modal = document.createElement('div');
  modal.id = 'manual-fallback';
  modal.innerHTML = `
    <div>
      <p>Для полноэкранного воспроизведения откройте видео в системном браузере</p>
      <a id="mf-open" target="_blank" rel="noopener noreferrer">Открыть в браузере</a>
      <button id="mf-close">Закрыть</button>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('mf-open').href = url;
  document.getElementById('mf-close').onclick = () => modal.remove();
}

loadAnime();
</script>

</body>
</html>
