<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинолист — Навигатор по аниме</title>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: #0e0e10;
    color: #e5e5e5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin: 20px 0;
  }

  header h1 {
    font-size: 1.5em;
    color: #a855f7;
  }

  .preview {
    width: 90%;
    max-width: 600px;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 0 20px rgba(168,85,247,0.3);
  }

  .preview img {
    width: 100%;
    height: auto;
    display: block;
  }

  .season {
    width: 90%;
    max-width: 600px;
    background-color: #18181b;
    margin-bottom: 15px;
    border-radius: 10px;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease;
  }

  .season.collapsed {
    max-height: 50px;
    padding-bottom: 0;
  }

  .season-header {
    background-color: #27272a;
    padding: 14px;
    cursor: pointer;
    font-weight: bold;
    color: #c084fc;
  }

  .episodes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px;
  }

  .episode-btn {
    background-color: #3f3f46;
    border: none;
    color: #e5e5e5;
    border-radius: 8px;
    padding: 10px 0;
    cursor: pointer;
    transition: background 0.2s;
  }

  .episode-btn:hover {
    background-color: #a855f7;
  }

  .episode-btn.next {
    background-color: #a855f7;
    color: white;
  }

  footer {
    margin: 40px 0 20px;
    text-align: center;
    font-size: 0.9em;
    color: #9ca3af;
  }

  /* Модальное окно */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .modal.active {
    display: flex;
  }

  .modal-content {
    background-color: #18181b;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 0 20px rgba(168,85,247,0.3);
    position: relative;
  }

  .close-btn {
    position: absolute;
    right: 14px;
    top: 10px;
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 1.2em;
    cursor: pointer;
  }

  .modal-content h2 {
    color: #c084fc;
  }

  .modal-content p {
    color: #d4d4d8;
    margin-bottom: 20px;
  }

  .continue-btn {
    background-color: #a855f7;
    border: none;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .continue-btn:hover {
    background-color: #9333ea;
  }

  .progress {
    margin: 10px 0 20px;
    font-size: 0.95em;
    color: #a1a1aa;
  }
</style>
</head>
<body>
  <header>
    <h1>Кинолист</h1>
    <div class="progress" id="progress-text"></div>
  </header>

  <div class="preview">
    <img src="https://i.imgur.com/nJpG0vL.jpeg" alt="Превью аниме">
  </div>

  <div id="anime-container"></div>

  <footer>С любовью, ваш Кинолист 💜</footer>

  <!-- Модальное окно -->
  <div class="modal" id="thanksModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <h2>Спасибо, что с нами!</h2>
      <p>Наш сервис полностью бесплатен 💜 Иногда вы можете увидеть рекламу — она помогает нам развиваться.  
      Если хотите поддержать проект, вы можете сделать небольшой донат звёздами на главной странице нашего бота 🌟  
      А сейчас — приятного просмотра!</p>
      <button class="continue-btn" id="continueBtn">Продолжить просмотр</button>
    </div>
  </div>

  <script>
    const animeData = [
      { season: 1, episodes: 24 },
      { season: 2, episodes: 24 },
      { season: 3, episodes: 24 }
    ];

    let watched = JSON.parse(localStorage.getItem('watched')) || { season: 1, episode: 0 };
    let watchCount = parseInt(localStorage.getItem('watchCount') || '0');

    const container = document.getElementById('anime-container');
    const modal = document.getElementById('thanksModal');
    const progressText = document.getElementById('progress-text');
    const continueBtn = document.getElementById('continueBtn');

    function renderProgress() {
      if (watched.episode === 0) {
        progressText.textContent = 'Вы ещё не начали смотреть это аниме 🌙';
      } else {
        progressText.innerHTML = `Последняя серия, которую вы посмотрели: <b>${watched.episode}</b> (${watched.season} сезон)`;
      }
    }

    function renderAnime() {
      container.innerHTML = '';
      animeData.forEach(season => {
        const div = document.createElement('div');
        div.classList.add('season', 'collapsed');
        const header = document.createElement('div');
        header.classList.add('season-header');
        header.textContent = `${season.season} сезон`;
        div.appendChild(header);

        const epContainer = document.createElement('div');
        epContainer.classList.add('episodes');

        for (let i = 1; i <= season.episodes; i++) {
          const btn = document.createElement('button');
          btn.classList.add('episode-btn');
          btn.textContent = i;

          if (season.season === watched.season && i === watched.episode + 1) {
            btn.classList.add('next');
          }

          btn.addEventListener('click', () => handleWatch(season.season, i));
          epContainer.appendChild(btn);
        }

        div.appendChild(epContainer);
        header.addEventListener('click', () => toggleSeason(div));
        container.appendChild(div);
      });
    }

    function toggleSeason(div) {
      document.querySelectorAll('.season').forEach(s => {
        if (s !== div) s.classList.add('collapsed');
      });
      div.classList.toggle('collapsed');
    }

    function handleWatch(season, episode) {
      watched = { season, episode };
      localStorage.setItem('watched', JSON.stringify(watched));
      renderProgress();
      renderAnime();

      watchCount++;
      localStorage.setItem('watchCount', watchCount);
      if (watchCount === 1 || watchCount % 5 === 0) {
        openModal();
      } else {
        window.open('https://ok.ru/videoembed/1161630648985?nochat=1&autoplay=1', '_blank');
      }
    }

    function openModal() {
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    continueBtn.addEventListener('click', () => {
      closeModal();
      setTimeout(() => {
        window.open('https://ok.ru/videoembed/1161630648985?nochat=1&autoplay=1', '_blank');
      }, 300);
    });

    renderProgress();
    renderAnime();
  </script>
</body>
</html>
