<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аниме Навигатор</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --accent-primary: #7c3aed;
      --accent-secondary: #a78bfa;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 85% 30%, rgba(167, 139, 250, 0.05) 0%, transparent 20%);
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 40px; position: relative; }
    .header h1 {
      font-size: 2.5rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 8px; letter-spacing: -0.5px;
    }
    .header p { color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin: 0 auto 20px; }
    .anime-cover {
      width: 200px;
      height: 280px;
      object-fit: cover;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin: 0 auto 20px;
      display: none;
    }

    .seasons-container { display: flex; flex-direction: column; gap: 20px; }
    .season {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .season:hover { transform: translateY(-5px); box-shadow: var(--shadow); }

    .season-header {
      padding: 20px 24px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .season-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: linear-gradient(to bottom, var(--accent-primary), var(--accent-secondary));
      transition: var(--transition);
    }
    .season-header:hover { background: var(--bg-tertiary); }
    .season-header h2 { font-size: 1.3rem; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 12px; }

    .season-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: rgba(124, 58, 237, 0.1); border-radius: 8px; color: var(--accent-primary); }
    .toggle-icon { transition: var(--transition); color: var(--text-secondary); font-size: 1.2rem; }
    .season.open .toggle-icon { transform: rotate(180deg); color: var(--accent-primary); }

    .episodes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 0 24px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease, padding 0.4s ease;
    }
    .season.open .episodes {
      padding: 20px 24px 24px;
      opacity: 1;
    }

    .episode-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative;
      overflow: hidden;
    }
    .episode-btn::before {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      transition: left 0.7s;
    }
    .episode-btn:hover { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(124,58,237,0.4); }
    .episode-btn:hover::before { left: 100%; }
    .episode-number { font-size: 1.1rem; }
    .episode-duration { font-size: 0.75rem; color: var(--text-secondary); opacity: 0.8; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: var(--transition); backdrop-filter: blur(5px); }
    .modal.active { opacity:1; visibility: visible; }
    .modal-content {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      transition: var(--transition);
      border: 1px solid rgba(255,255,255,0.05);
      position: relative;
    }
    .modal.active .modal-content { transform: translateY(0); }
    .modal-icon { font-size: 3rem; color: var(--accent-primary); margin-bottom: 20px; }
    .modal h3 { font-size: 1.5rem; margin-bottom: 15px; color: var(--text-primary); }
    .modal p { color: var(--text-secondary); margin-bottom: 25px; line-height: 1.6; }
    .modal-actions { display: flex; gap: 12px; justify-content: center; }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color:white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow:0 5px 15px rgba(124,58,237,0.4); }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.3rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .close-modal:hover { color: var(--text-primary); }

    footer { text-align:center; padding:40px 0 20px; color:var(--text-muted); font-size:0.9rem; margin-top:40px; border-top:1px solid rgba(255,255,255,0.05); }
    .heart { color:#ef4444; display:inline-block; animation:pulse 1.5s infinite; }
    @keyframes pulse {0%{transform:scale(1);}50%{transform:scale(1.1);}100%{transform:scale(1);}}

    @media(max-width:768px){
      .episodes{grid-template-columns:repeat(4,1fr);}
    }
    @media(max-width:480px){
      .episodes{grid-template-columns:repeat(4,1fr);}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 id="anime-title">Аниме Навигатор</h1>
      <p>Откройте для себя мир аниме в стильном минималистичном интерфейсе</p>
      <img id="anime-cover" class="anime-cover" alt="Обложка аниме">
    </header>

    <div id="seasons-container" class="seasons-container"></div>

    <footer>
      С любовью, ваш <span class="heart">❤️</span> Кинолист
    </footer>
  </div>

  <script>
    async function loadAnime() {
      const params = new URLSearchParams(window.location.search);
      const animeId = params.get("anime");
      if (!animeId) {
        document.getElementById("anime-title").textContent = "Аниме не выбрано";
        return;
      }

      try {
        const response = await fetch(`data/${animeId}.json`);
        if (!response.ok) throw new Error("Не удалось загрузить JSON");
        const animeData = await response.json();

        document.getElementById("anime-title").textContent = animeData.title;
        if (animeData.cover) {
          const img = document.getElementById("anime-cover");
          img.src = animeData.cover;
          img.style.display = "block";
        }

        const container = document.getElementById("seasons-container");

        animeData.seasons.forEach((season) => {
          const seasonDiv = document.createElement("div");
          seasonDiv.className = "season";

          const header = document.createElement("div");
          header.className = "season-header";

          const title = document.createElement("h2");
          const icon = document.createElement("div");
          icon.className = "season-icon";
          icon.innerHTML = `<i class="fas fa-play"></i>`;
          const titleText = document.createElement("span");
          titleText.textContent = season.name;
          title.appendChild(icon);
          title.appendChild(titleText);

          const toggleIcon = document.createElement("span");
          toggleIcon.className = "toggle-icon";
          toggleIcon.innerHTML = `<i class="fas fa-chevron-down"></i>`;
          header.appendChild(title);
          header.appendChild(toggleIcon);
          seasonDiv.appendChild(header);

          const episodesDiv = document.createElement("div");
          episodesDiv.className = "episodes";

          season.episodes.forEach(ep => {
            const btn = document.createElement("button");
            btn.className = "episode-btn";
            const numberSpan = document.createElement("span");
            numberSpan.className = "episode-number";
            numberSpan.textContent = ep.number;
            btn.appendChild(numberSpan);
            if (ep.duration) {
              const durationSpan = document.createElement("span");
              durationSpan.className = "episode-duration";
              durationSpan.textContent = ep.duration;
              btn.appendChild(durationSpan);
            }
            btn.onclick = () => window.open(ep.url, "_blank");
            episodesDiv.appendChild(btn);
          });

          seasonDiv.appendChild(episodesDiv);
          container.appendChild(seasonDiv);

          header.addEventListener("click", () => {
            const isOpen = seasonDiv.classList.contains("open");

            document.querySelectorAll('.season.open').forEach(openSeason => {
              if (openSeason !== seasonDiv) {
                openSeason.classList.remove("open");
                const eps = openSeason.querySelector(".episodes");
                eps.style.maxHeight = "0px";
                eps.style.opacity = "0";
              }
            });

            if (!isOpen) {
              seasonDiv.classList.add("open");
              const eps = seasonDiv.querySelector(".episodes");
              eps.style.maxHeight = eps.scrollHeight + "px";
              eps.style.opacity = "1";
            } else {
              const eps = seasonDiv.querySelector(".episodes");
              eps.style.maxHeight = "0px";
              eps.style.opacity = "0";
              seasonDiv.classList.remove("open");
            }
          });
        });
      } catch (err) {
        console.error(err);
        document.getElementById("anime-title").textContent = "Ошибка загрузки данных";
      }
    }

    document.addEventListener('DOMContentLoaded', loadAnime);
  </script>
</body>
</html>
