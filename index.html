<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Video</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #000;
    display: flex;
    flex-direction: column;
  }

  #video-container {
    flex: 1;
    position: relative;
  }

  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  #open-browser-btn {
    width: 100%;
    padding: 12px;
    background: #4a76a8; /* VK-синий */
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    border: none;
    cursor: pointer;
  }

  #open-browser-btn:hover {
    background: #3b5c82;
  }
</style>
</head>
<body>

<div id="video-container">
  <iframe 
    src="https://vkvideo.ru/video_ext.php?oid=-144329953&id=456250037&hash=520e7f59f1a89dd2" 
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
    allowfullscreen
    frameborder="0">
  </iframe>
</div>

<button id="open-browser-btn" onclick="openInBrowser()">Смотреть в браузере (Fullscreen)</button>

<script>
function openInBrowser() {
  const url = "https://vkvideo.ru/video_ext.php?oid=-144329953&id=456250037&hash=520e7f59f1a89dd2";
  window.open(url, "_blank");
}
</script>

</body>
</html>
